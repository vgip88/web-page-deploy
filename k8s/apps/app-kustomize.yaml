apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conversao
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  source: 
    repoURL: https://github.com/vgip88/web-page-deploy.git
    targetRevision: HEAD
    path: deploy_kustomize
  destination: 
    namespace: conversao
    server: https://kubernetes.default.svc