apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webcolor
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  source: 
    repoURL: https://github.com/vgip88/web-page-deploy.git
    path: k8s
    targetRevision: HEAD
    directory:
      recurse: true
      include: '{deploy_nginx/*,deploy_webcolor/*}'
  destination: 
    namespace: webcolor
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=true
      - PrunePropagationPolicy=foreground
      - PruneLast=false
      - RespectIgnoreDifferences=true
  info:
    - name: Projeto
      value: ArgoCD Webcolor
