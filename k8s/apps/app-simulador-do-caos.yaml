apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vgip88/web-page-deploy.git
    path: k8s
    targetRevision: HEAD
    directory:
      recurse: true
      include: '{deploy_simulador_do_caos/*}'
  destination:
    namespace: caos
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: "apps"
      kind: Deployment
      name: web
      jsonPointers:
        - /spec/replicas
    group: autoscaling
    kind: HorizontalPodAutoscaler
    name: web
    jsonPointers:
      - /status/currentReplicas
      - /status/desiredReplicas
      
    