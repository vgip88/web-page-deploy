apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webcolor
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  source: 
    repoURL: https://github.com/vgip88/web-page-deploy.git
    path: k8s
    targetRevision: HEAD
    directory:
      recurse: true
      #exclude: "nginx/*"  # -- exclui apenas o nginx
      #include: "webcolor/*" # -- inclui apenas o webcolor
      #include: '{nginx/*,webcolor/*}' # -- inclui apenas o nginx e webcolor
  destination: 
    namespace: webcolor
    server: https://kubernetes.default.svc
  info:
    - name: Projeto
      value: ArgoCD Webcolor
